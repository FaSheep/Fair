query AssignByAddress($from: Bytes = "") {
    rolesAssigneds(orderBy: blockNumber, orderDirection: desc, where: {from: $from}) {
        blockTimestamp
        names
        roles
        transactionHash
    }
}

query ById($id: ID = "") {
    rolesAssigned(id: $id) {
        blockTimestamp
        names
        roles
        transactionHash
    }
}
