query NumById($id: ID = "") {
    getRand(id: $id) {
        blockTimestamp
        transactionHash
        num
        min
        max
    }
}

query NumByAddress($from: Bytes) {
    getRands(orderBy: blockNumber, orderDirection: desc, where: {from: $from}) {
        blockTimestamp
        transactionHash
        num
        min
        max
    }
}
